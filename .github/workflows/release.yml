# Build the app for Linux, Windows and macOS and attach the binaries to a GitHub Release.
#
# Triggered only by a semver tag:  git tag v1.0.0 && git push origin v1.0.0
# A tag with a pre-release suffix (v1.0.0-rc.1) is published as a pre-release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the tag is semver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not semver (expected e.g. v1.0.0 or v1.0.0-rc.1)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          lfs: false  # the design PNGs aren't needed to build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for headless Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: python scripts/build.py

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python scripts/smoke_test.py dist/wint-receipts.exe ;;
            macOS)   python scripts/smoke_test.py dist/wint-receipts.app ;;
            *)       python scripts/smoke_test.py dist/wint-receipts ;;
          esac

      - name: Package
        id: package
        shell: bash
        run: |
          mkdir -p release
          base="wint-receipts-${GITHUB_REF_NAME}-${{ matrix.label }}"
          case "$RUNNER_OS" in
            Windows)
              cp dist/wint-receipts.exe "release/${base}.exe" ;;
            macOS)
              # ditto keeps the .app bundle's symlinks and permissions intact
              ditto -c -k --keepParent dist/wint-receipts.app "release/${base}.zip" ;;
            *)
              cp dist/wint-receipts "release/${base}"
              chmod +x "release/${base}" ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
